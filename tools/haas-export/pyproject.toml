[project]
name = "vrc-tsuyaku-haas-export"
version = "0.1.0"
description = "Offline Haas-ja-v1.0 ONNX export and decoding reference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "onnx==1.22.0",
    "onnxruntime==1.31.1",
    "sentencepiece>=0.2.2,<0.3",
]

[dependency-groups]
export = [
    "haas-asr @ git+https://github.com/third-intelligence/Haas-ASR.git@acc614f68769dcbfae9dba96b48439c4a66295af",
    "nemo-toolkit[asr]==2.7.3",
    "flash-linear-attention==0.5.2",
    "torch==2.14.0",
]

[tool.uv]
package = false
