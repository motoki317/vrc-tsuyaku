<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title data-i18n="label.product"></title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand"><span class="mark" aria-hidden="true"></span><span class="product" data-i18n="label.product"></span></h1>
    <nav id="tabs" class="tabs" data-i18n-aria-label="label.screens" hidden>
      <button type="button" class="tab" data-screen="translation"><svg class="icon" aria-hidden="true"><use href="#i-captions"></use></svg><span data-i18n="label.translation"></span></button>
      <button type="button" class="tab" data-screen="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg><span data-i18n="label.settings"></span><span class="update-dot" aria-hidden="true" hidden></span></button>
    </nav>
    <div class="bar-item menu">
      <button type="button" id="ui-language" class="bar-button" aria-haspopup="menu" aria-expanded="false" aria-controls="ui-language-menu">
        <svg class="icon" aria-hidden="true"><use href="#i-globe"></use></svg><span id="ui-language-name" class="bar-label"></span><svg class="icon small" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
      </button>
      <div id="ui-language-menu" class="menu-list" role="menu" data-i18n-aria-label="label.uiLanguage" hidden>
        <button type="button" role="menuitemradio" data-value="" data-i18n="value.languageBrowser"></button>
        <button type="button" role="menuitemradio" data-value="en" lang="en" data-i18n="value.languageEnglish"></button>
        <button type="button" role="menuitemradio" data-value="ja" lang="ja" data-i18n="value.languageJapanese"></button>
      </div>
      <p id="ui-language-error" class="bar-error error-text" hidden></p>
    </div>
    <div class="bar-item">
      <button type="button" id="exit" class="bar-button" data-i18n-aria-label="action.exit"><svg class="icon" aria-hidden="true"><use href="#i-power"></use></svg><span class="bar-label" data-i18n="action.exit"></span></button>
      <p id="exit-error" class="bar-error error-text" hidden></p>
    </div>
  </div>
</header>

<div id="connection" class="connection" hidden>
  <svg class="icon" aria-hidden="true"><use href="#i-wifi-off"></use></svg>
  <span class="spinner-slot" aria-hidden="true"><svg class="icon spin"><use href="#i-loader-circle"></use></svg></span>
  <span id="connection-text" role="status"></span>
</div>

<main id="main">
  <section id="screen-setup" class="screen setup" hidden>
    <div class="setup-column">
      <div class="plan">
        <div class="plan-slot"></div>
        <div class="plan-foot"></div>
      </div>
      <div class="setup-next">
        <button type="button" id="next" class="button"><span data-i18n="action.next"></span><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
      </div>
    </div>
  </section>

  <section id="screen-translation" class="screen translation" hidden>
    <div id="log" class="log" role="log" aria-live="off" tabindex="0" data-i18n-aria-label="label.log">
      <div class="log-column">
        <ol id="log-list" class="log-list"></ol>
        <div id="ghosts" class="ghosts" aria-hidden="true">
          <div class="ghost world"><span class="avatar"><svg class="icon"><use href="#i-users"></use></svg></span><span class="ghost-bubble"></span></div>
          <div class="ghost self"><span class="ghost-bubble"></span><span class="avatar"><svg class="icon"><use href="#i-mic"></use></svg></span></div>
        </div>
        <div id="dots-world" class="msg world speaking" aria-hidden="true" hidden>
          <span class="avatar"><svg class="icon"><use href="#i-users"></use></svg></span>
          <div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>
        </div>
        <div id="dots-self" class="msg self speaking" aria-hidden="true" hidden>
          <div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>
        </div>
      </div>
    </div>
    <button type="button" id="unread" class="unread" hidden><svg class="icon" aria-hidden="true"><use href="#i-arrow-down"></use></svg><span id="unread-count"></span></button>
  </section>

  <section id="screen-settings" class="screen settings" hidden>
    <nav class="rail" data-i18n-aria-label="label.settingsSections">
      <button type="button" class="rail-item" data-sub="models"><svg class="icon" aria-hidden="true"><use href="#i-languages"></use></svg><span data-i18n="label.languagesModels"></span></button>
      <button type="button" class="rail-item" data-sub="downloads"><svg class="icon" aria-hidden="true"><use href="#i-hard-drive-download"></use></svg><span data-i18n="label.downloads"></span></button>
      <button type="button" class="rail-item" data-sub="microphone"><svg class="icon" aria-hidden="true"><use href="#i-mic"></use></svg><span data-i18n="label.microphone"></span></button>
      <button type="button" class="rail-item" data-sub="chatbox"><svg class="icon" aria-hidden="true"><use href="#i-message-square-text"></use></svg><span data-i18n="label.chatbox"></span></button>
      <button type="button" class="rail-item" data-sub="about"><svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg><span data-i18n="label.about"></span><span class="update-dot" aria-hidden="true" hidden></span></button>
    </nav>

    <!-- The language plan fills the two slots: the flows' rows, then Download all and the downloads list. -->
    <div id="sub-models" class="sub" hidden>
      <h2 class="sub-title" tabindex="-1" data-i18n="label.languagesModels"></h2>
      <div class="plan">
        <div class="plan-slot"></div>
        <div class="translator">
          <div class="label-row">
            <h3 class="field-label" id="translator-label" data-i18n="label.translator"></h3>
            <span class="shared" aria-hidden="true"><svg class="icon"><use href="#i-mic"></use></svg><svg class="icon"><use href="#i-users"></use></svg></span>
            <span class="saved" id="translator-saved" aria-hidden="true" hidden><svg class="icon"><use href="#i-check"></use></svg><span data-i18n="state.saved"></span></span>
          </div>
          <div id="translators" class="options" role="radiogroup" aria-labelledby="translator-label" aria-describedby="translator-hint"></div>
          <p id="translator-error" class="error-text" hidden></p>
          <p id="translator-hint" class="hint" data-i18n="note.translatorHint"></p>
        </div>
        <p class="memory-total"><svg class="icon" aria-hidden="true"><use href="#i-memory-stick"></use></svg><span data-i18n="label.memoryTotal"></span><span id="memory-total" class="value"></span></p>
        <div class="plan-foot"></div>
      </div>
    </div>

    <!-- Every catalog file shows once, in the first group that holds it. -->
    <div id="sub-downloads" class="sub" hidden>
      <h2 class="sub-title" tabindex="-1" data-i18n="label.downloads"></h2>
      <p class="installed-total"><span data-i18n="label.installed"></span> <span id="installed-size" class="value"></span></p>
      <div class="download-groups">
        <div id="downloads-needed" class="download-group">
          <h3 class="field-label" id="downloads-needed-label" data-i18n="label.neededDownloads"></h3>
          <ul class="download-list" aria-labelledby="downloads-needed-label"></ul>
        </div>
        <div id="downloads-unneeded" class="download-group">
          <h3 class="field-label" id="downloads-unneeded-label" data-i18n="label.unneededDownloads"></h3>
          <ul class="download-list" aria-labelledby="downloads-unneeded-label"></ul>
        </div>
        <div id="downloads-missing" class="download-group">
          <h3 class="field-label" id="downloads-missing-label" data-i18n="label.missingDownloads"></h3>
          <ul class="download-list" aria-labelledby="downloads-missing-label"></ul>
        </div>
      </div>
    </div>

    <div id="sub-microphone" class="sub" hidden>
      <div class="sub-head"><h2 class="sub-title" id="microphone-label" tabindex="-1" data-i18n="label.microphone"></h2><span class="saved" id="microphone-saved" aria-hidden="true" hidden><svg class="icon"><use href="#i-check"></use></svg><span data-i18n="state.saved"></span></span></div>
      <div class="field-row">
        <select id="microphone" class="select" aria-labelledby="microphone-label"></select>
        <button type="button" id="refresh-mics" class="icon-button" data-i18n-aria-label="action.refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh-cw"></use></svg></button>
        <span id="microphone-state" class="field-state warning" hidden><svg class="icon" aria-hidden="true"><use href="#i-circle-alert"></use></svg><span data-i18n="state.notConnected"></span></span>
      </div>
      <p id="microphone-error" class="error-text" hidden></p>
    </div>

    <div id="sub-chatbox" class="sub" hidden>
      <h2 class="sub-title" tabindex="-1" data-i18n="label.chatbox"></h2>
      <div class="field-group">
        <div class="label-row"><label class="field-label" for="address" data-i18n="label.address"></label><span class="saved" id="address-saved" aria-hidden="true" hidden><svg class="icon"><use href="#i-check"></use></svg><span data-i18n="state.saved"></span></span></div>
        <div class="field-row">
          <input id="address" class="input mono" autocomplete="off" spellcheck="false" aria-describedby="address-error">
        </div>
        <p id="address-error" class="error-text" hidden></p>
      </div>
      <div class="field-group">
        <div class="label-row"><span class="field-label" id="message-label" data-i18n="label.message"></span><span class="saved" id="template-saved" aria-hidden="true" hidden><svg class="icon"><use href="#i-check"></use></svg><span data-i18n="state.saved"></span></span></div>
        <div id="presets" class="segmented" role="group" aria-labelledby="message-label"></div>
        <div id="custom" hidden>
          <div id="tokens" class="chips" role="group" data-i18n-aria-label="label.insert"></div>
          <textarea id="template" class="input mono template" rows="3" spellcheck="false" aria-labelledby="message-label" aria-describedby="template-error"></textarea>
        </div>
        <div id="template-error" class="error-text" hidden></div>
        <div id="preview" class="preview" role="group" data-i18n-aria-label="label.preview"></div>
      </div>
    </div>

    <div id="sub-about" class="sub" hidden>
      <h2 class="sub-title about-title" tabindex="-1" data-i18n="label.product"></h2>
      <p class="about-description" data-i18n="value.description"></p>
      <p id="app-version" class="about-version"></p>
      <p id="app-update" class="about-update" role="status"></p>
      <!-- A link with a data-path goes to app.repository from /api/state plus that path. The app serves the notices
           from the license texts that the executable carries. -->
      <p class="about-links">
        <a data-path="" target="_blank" rel="noreferrer"><span data-i18n="label.sourceCode"></span><svg class="icon small" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></a>
        <a data-path="/releases" target="_blank" rel="noreferrer"><span data-i18n="label.releases"></span><svg class="icon small" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></a>
        <a data-path="/blob/main/LICENSE" target="_blank" rel="noreferrer"><span data-i18n="label.appLicense"></span><svg class="icon small" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></a>
        <a href="/notices.txt" target="_blank" rel="noreferrer"><span data-i18n="label.thirdPartyNotices"></span><svg class="icon small" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></a>
      </p>
      <h3 class="field-label" id="licenses-label" data-i18n="label.softwareUsed"></h3>
      <ul id="licenses" class="license-list" aria-labelledby="licenses-label"></ul>
    </div>

    <div class="rail-foot">
      <button type="button" class="rail-item" data-open="data" data-error="open-data-error" data-i18n-aria-label="action.openData"><svg class="icon" aria-hidden="true"><use href="#i-folder-open"></use></svg><span data-i18n="label.dataFolder"></span><svg class="icon small exit" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></button>
      <p class="error-text" id="open-data-error" hidden></p>
      <button type="button" class="rail-item" data-open="settings" data-error="open-settings-error" data-i18n-aria-label="action.openSettingsFile"><svg class="icon" aria-hidden="true"><use href="#i-file-cog"></use></svg><span data-i18n="label.settingsFile"></span><svg class="icon small exit" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></button>
      <p class="error-text" id="open-settings-error" hidden></p>
    </div>
  </section>

  <section id="screen-settings-error" class="screen settings-error" hidden>
    <div class="settings-error-column">
      <h2 class="settings-error-title"><svg class="icon large" aria-hidden="true"><use href="#i-file-warning"></use></svg><span data-i18n="title.settingsError"></span></h2>
      <pre id="settings-error-text" class="settings-error-text"></pre>
      <div class="settings-error-actions">
        <button type="button" class="button secondary" data-open="settings" data-error="replace-error"><svg class="icon" aria-hidden="true"><use href="#i-file-cog"></use></svg><span data-i18n="action.openSettingsFile"></span><svg class="icon small" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></button>
        <button type="button" id="replace-settings" class="button secondary"><span data-i18n="action.replaceSettings"></span></button>
      </div>
      <p id="replace-error" class="error-text" hidden></p>
    </div>
  </section>

  <div id="switchbar" class="switchbar" hidden>
    <div class="switchbar-inner"></div>
  </div>
</main>

<section id="screen-exited" class="screen exited" hidden>
  <svg class="icon large" aria-hidden="true"><use href="#i-power"></use></svg>
  <h2 id="exited-title" tabindex="-1" data-i18n="title.exited"></h2>
  <p id="exited-close" role="status"></p>
</section>

<dialog id="license-dialog" class="dialog license" aria-labelledby="license-title">
  <div class="dialog-head">
    <h2 id="license-title"></h2>
    <button type="button" class="icon-button" data-close data-i18n-aria-label="action.close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
  </div>
  <ul id="license-downloads" class="download-list license-downloads"></ul>
  <pre id="license-text" class="license-text" tabindex="0" role="region" aria-labelledby="license-title"></pre>
  <div class="dialog-actions">
    <button type="button" class="button secondary" data-close data-i18n="action.cancel"></button>
    <button type="button" id="license-accept" class="button"><svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg><span data-i18n="action.acceptDownload"></span></button>
  </div>
</dialog>

<dialog id="delete-dialog" class="dialog" aria-labelledby="delete-title">
  <h2 id="delete-title"></h2>
  <p id="delete-size" class="value"></p>
  <p id="delete-flows" class="delete-flows"></p>
  <p id="delete-error" class="error-text" hidden></p>
  <div class="dialog-actions">
    <button type="button" class="button secondary" data-close data-i18n="action.cancel"></button>
    <button type="button" id="delete-confirm" class="button danger"><svg class="icon" aria-hidden="true"><use href="#i-trash-2"></use></svg><span data-i18n="action.delete"></span></button>
  </div>
</dialog>

<dialog id="replace-dialog" class="dialog" aria-labelledby="replace-title">
  <h2 id="replace-title" data-i18n="title.replaceSettings"></h2>
  <div class="dialog-actions">
    <button type="button" class="button secondary" data-close data-i18n="action.cancel"></button>
    <button type="button" id="replace-confirm" class="button danger" data-i18n="action.replace"></button>
  </div>
</dialog>

<div id="announce" class="visually-hidden" aria-live="polite"></div>
</body>
</html>
